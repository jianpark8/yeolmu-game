<title>열무 게임방</title>

<style>
/* Layout: 아이용 밝은 한 화면 — 홈(오늘 한 것 + 게임 두 개) → 게임 화면 */
:root{
  color-scheme:light;
  --k-bg:#fff6e6; --k-card:#ffffff; --k-ink:#2d2a3a; --k-soft:#7a7487; --k-line:#eadfcb;
  --k-blue:#3d9bff; --k-pink:#ff6fa3; --k-yellow:#ffc93c; --k-green:#2fc283; --k-red:#ff6b6b;
  --kid:"Jua","IBM Plex Sans KR",system-ui,sans-serif; --sans:"IBM Plex Sans KR",system-ui,sans-serif;
}
body{background:var(--k-bg);color:var(--k-ink);font-family:var(--kid)}
button:focus-visible{outline:3px solid var(--k-blue);outline-offset:2px}
/* 게임방 오버레이 */
#gameRoom{position:fixed;inset:0;z-index:50;background:var(--k-bg);color:var(--k-ink);overflow:auto;font-family:var(--kid);color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gr-in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px;display:flex;flex-direction:column;gap:14px}
.gr-top{display:flex;align-items:center;gap:10px}
.gr-top button{font:18px var(--kid);background:var(--k-card);color:var(--k-ink);border:2px solid var(--k-line);border-radius:12px;padding:6px 12px}
.gr-top h2{margin:0;font:400 22px var(--kid);flex:1}
.gr-stars{font:20px var(--kid);color:#b98500;background:#fff1c2;border-radius:20px;padding:4px 12px}
.kcard{background:var(--k-card);border:2px solid var(--k-line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.kbtn{font:400 20px var(--kid);border:0;border-radius:14px;padding:14px;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.kbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.kbtn.ghost{background:var(--k-card);color:var(--k-ink);border:2px solid var(--k-line);box-shadow:none}
.ksets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.kset{text-align:left;font:400 19px var(--kid);background:var(--k-card);color:var(--k-ink);border:2px solid var(--k-line);border-left:8px solid var(--k-pink);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.kset small{font:13px var(--sans);color:var(--k-soft)}
.kprog{display:flex;gap:4px}
.kprog i{flex:1;height:8px;border-radius:4px;background:var(--k-line)}
.kprog i.done{background:var(--k-green)}
.kprog i.now{background:var(--k-yellow)}
.kword{font:400 52px/1.1 var(--kid);text-align:center;letter-spacing:.02em;word-break:break-all}
.kq{font:400 34px/1.2 var(--kid);text-align:center}
.kq .box{display:inline-block;min-width:1.6em;padding:0 .2em;border-bottom:4px solid var(--k-blue);color:var(--k-blue)}
.ksub{font:16px var(--sans);color:var(--k-soft);text-align:center}
.kopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kopt{font:400 22px var(--kid);background:#eef6ff;color:var(--k-ink);border:2px solid #cfe4ff;border-radius:14px;padding:16px 8px;cursor:pointer}
.kopt.right{background:var(--k-green);border-color:var(--k-green);color:#fff}
.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.slots span{font:400 38px/1 var(--kid);min-width:42px;height:56px;display:grid;place-items:center;border-radius:10px;background:#f3eee4}
.slots span.blank{background:#fff;border:3px dashed var(--k-blue);color:var(--k-blue)}
.slots span.cur{border-style:solid;background:#eaf3ff}
.pad{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:8px}
.pad button,.npad button{font:400 28px var(--kid);background:#fff;color:var(--k-ink);border:2px solid var(--k-line);border-radius:12px;padding:10px 0;cursor:pointer;box-shadow:0 3px 0 var(--k-line)}
.npad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.npad .ok{background:var(--k-green);color:#fff;border-color:var(--k-green)}
.frames{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tf{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border:3px solid var(--k-ink);border-radius:10px;background:#fff;width:150px}
.tf i{aspect-ratio:1;border-radius:50%;background:#efe9de}
.tf i.a{background:var(--k-blue)}
.tf i.b{background:var(--k-pink)}
.tf.full{border-color:var(--k-green)}
.tfl{font:14px var(--kid);color:var(--k-soft);text-align:center;margin-top:2px}
.hint{font:17px var(--kid);background:#fff4cc;border-radius:12px;padding:10px 12px;color:#6b5200;text-align:center}
.fb{font:24px var(--kid);text-align:center;min-height:1.3em}
.fb.good{color:var(--k-green)} .fb.retry{color:var(--k-red)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.ksteps{display:flex;flex-direction:column;gap:4px;font:18px var(--kid);color:var(--k-soft);text-align:center}
.ksteps .done{color:var(--k-green)}

.bigbtn{font:400 26px var(--kid);border:0;border-radius:22px;padding:26px 10px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.bigbtn small{font:16px var(--kid);opacity:.92}
.bigbtn .badge{font:15px var(--kid);background:rgba(255,255,255,.9);color:var(--k-green);border-radius:20px;padding:2px 10px}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today .wide{grid-column:1/-1}
.jpbtn{grid-column:1/-1;background:var(--k-yellow)!important;color:var(--k-ink)!important}
.jko{font:400 44px/1.1 var(--kid);text-align:center}
.jja{font:400 20px var(--kid);color:var(--k-soft);text-align:center}
.jmean{font:400 22px var(--kid);text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a.kbtn{text-decoration:none;text-align:center}
.today div{background:#fffaf0;border:2px dashed var(--k-line);border-radius:14px;padding:10px;text-align:center;font:18px var(--kid)}
.today div.on{border-style:solid;border-color:var(--k-green);background:#eafaf2}
.today small{display:block;font:14px var(--sans);color:var(--k-soft);margin-top:2px}
.lvrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lvrow button{font:18px var(--kid);width:44px;height:44px;border-radius:50%;border:2px solid var(--k-line);background:#fff;color:var(--k-ink);cursor:pointer}
.lvrow button.on{background:var(--k-blue);border-color:var(--k-blue);color:#fff}
details.grown summary{font:14px var(--sans);color:var(--k-soft);cursor:pointer;text-align:center}
details.grown .kcard{margin-top:8px}

.mwrap{position:relative;display:flex;align-items:center}
.mascot{width:52px;height:54px}
.bubble{position:absolute;right:56px;top:6px;white-space:nowrap;font:15px var(--kid);background:#fff;border:2px solid var(--k-line);border-radius:12px;padding:3px 9px}
.hero{display:flex;align-items:center;gap:12px;justify-content:center}
.herom{width:110px;height:114px;flex:none}
.herosay{display:flex;flex-direction:column;gap:2px}
.herosay .home-hi{text-align:left}
.herosay .ksub{text-align:left}

.mascot{cursor:pointer}
.herom{width:140px;height:148px;flex:none;background:none;border:0;padding:0;cursor:pointer}
.bubble2{align-self:flex-start;font:15px var(--kid);background:#fff;border:2px solid var(--k-line);border-radius:12px;padding:3px 10px;margin-top:4px}
@media (prefers-reduced-motion:no-preference){
 .sd *{transform-box:fill-box}

/* 모바일 브라우저 음성합성 안정화: 사용자 터치에서 음성 엔진 깨우기 */
let ymSpeechTimer=null;
function ymSpeak(text,lang='ko-KR',rate=1,pitch=1.3){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window))return;
  try{
    const synth=window.speechSynthesis;
    clearTimeout(ymSpeechTimer);
    synth.cancel();
    const utter=new SpeechSynthesisUtterance(String(text).replace(/!/g,''));
    utter.lang=lang;utter.rate=rate;utter.pitch=pitch;utter.volume=1;
    const voices=synth.getVoices();
    const exact=voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase());
    const fallback=voices.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));
    if(exact||fallback)utter.voice=exact||fallback;
    ymSpeechTimer=setTimeout(()=>{try{synth.resume();synth.speak(utter)}catch(e){console.warn('음성 재생 실패',e)}},70);
  }catch(e){console.warn('음성합성 오류',e)}
}

function sayEn(t){ymSpeak(t,"en-US",.8,1)}

const PAST_WORDS=new Set(["flapped","peered","blocked","chopped","rumbled","tugged","allowed","wandered","felt","found"]);
function wordPicture(w,showMeaning=true,solved=false){
 const card=el('div','word-art'+(solved?' correct':''));const key=String(w.word).toLowerCase();
 let drawn=false;
 try{const svg=WORD_ART.svg(key);if(svg){const box=el('div','wa-box');box.innerHTML=svg;box.setAttribute('role','img');box.setAttribute('aria-label',w.mean);card.appendChild(box);drawn=true}}catch(e){}
 if(!drawn){const scene=el('div','scene',WORD_SCENES[key]||'🌟');scene.setAttribute('role','img');scene.setAttribute('aria-label',w.mean);card.appendChild(scene)}
 if(PAST_WORDS.has(key))card.appendChild(el('div','past','과거형 · 이미 한 일'));
 if(showMeaning)card.appendChild(el('div','caption',w.mean));
 const audio=el('button','speak','🔊');audio.type='button';audio.setAttribute('aria-label','영어 발음 듣기');audio.onclick=()=>sayEn(w.word);card.appendChild(audio);
 if(solved){['★','✦','★','✦','★'].forEach((ch,i)=>{const p=el('span','wa-pop',ch);p.style.left=(14+i*18)+'%';p.style.animationDelay=(i*.07)+'s';card.appendChild(p)})}
 return card;
}
/* 헷갈리는 짝(같은 뜻·비슷한 뜻)은 뜻 고르기 보기에 같이 나오지 않게 */
const CONFUSE=[["quick","fast"],["house","home"]];
function confusable(a,b){return CONFUSE.some(p=>p.includes(a)&&p.includes(b))}

/* ---------- 영단어 게임 ---------- */
const BLANKS=w=>w.length<=4?2:w.length<=6?3:4;
/* 빈칸: 알파벳 자리만, 개수는 글자 수 기준, 적어도 한 글자는 보이게 */
function makeBlanks(word){const letters=[...word].map((ch,i)=>i).filter(i=>/[a-z]/i.test(word[i]));
  const n=Math.max(1,Math.min(BLANKS(letters.map(i=>word[i]).join("")),letters.length-1));
  return shuffle(letters).slice(0,n).sort((a,b)=>a-b)}
/* 알파벳 버튼: 정답 글자 전부 + 헷갈리는 글자 3개 */
function makePad(word,blanks){const need=blanks.map(i=>word[i].toLowerCase());
  const extra=shuffle("abcdefghijklmnopqrstuvwxyz".split("").filter(x=>!need.includes(x))).slice(0,3);return{need,keys:shuffle([...need,...extra])}}
function wordSets(){return Object.keys(words).map(id=>({id,...words[id]})).filter(s=>Array.isArray(s.words)&&s.words.length).sort((a,b)=>(b.order||0)-(a.order||0))}
function wordMenu(){
  openRoom("영단어 게임");GB.textContent="";
  const sets=wordSets();
  const c=el("div","kcard");
  c.appendChild(el("div","ksub","어떤 단어로 할까?"));
  if(!sets.length){c.appendChild(el("div","hint","이번 주 단어가 아직 없어요. 엄마가 단어장 사진을 Claude에게 보내면 여기 생겨요."));GB.appendChild(c);return}
  const g=el("div","ksets");
  sets.forEach((s,i)=>{const b=el("button","kset");b.style.setProperty("--c",["#ff6fa3","#3d9bff","#2fc283","#ffb21f"][i%4]);
    b.append(el("span",null,(i===0?"★ ":"")+s.title),el("small",null,s.words.slice(0,4).map(w=>w.word).join(", ")+(s.words.length>4?" …":"")+" · "+s.words.length+"개"));
    b.onclick=()=>wordStart(s);g.appendChild(b)});
  c.appendChild(g);GB.appendChild(c);
}
let WS=null;
function wordStart(set){
  const all=wordSets().flatMap(s=>s.words);
  WS={set,list:shuffle(set.words).slice(0,8),i:0,phase:"mean",first:0,miss:false,stars:0,pool:all};
  wordRender();
}
function wordAlive(s){return WS===s&&!GR.hidden&&!GR.classList.contains("fieldmode")&&$("#grTitle").textContent==="영단어 게임"}
function wordRender(){
  try{wordRenderInner()}catch(err){
    /* 오류가 나도 별·기록은 지키고 다음 단어로 넘어가요 */
    const s=WS;if(!s)return;s.errs=(s.errs||0)+1;
    if(s.errs>3||s.i>=s.list.length-1){try{wordEnd()}catch(e2){closeRoom()}}
    else{s.i++;s.phase="mean";s.blanks=null;s.miss=false;s.lock=false;try{wordRenderInner()}catch(e3){try{wordEnd()}catch(e4){closeRoom()}}}
  }
}
function wordRenderInner(){
  GB.textContent="";const s=WS,w=s.list[s.i];if(!w){wordEnd();return}
  const c=el("div","kcard");
  const pr=el("div","kprog");s.list.forEach((_,i)=>{const p=el("i");if(i<s.i)p.className="done";else if(i===s.i)p.className="now";pr.appendChild(p)});
  c.appendChild(pr);
  if(s.phase==="mean"){
    c.appendChild(el("div","ksub","이 단어의 뜻은?"));
    const wd=el("div","kword",w.word);c.appendChild(wd);
    const sp=el("button","kbtn ghost","▶ 소리 듣기");sp.onclick=()=>sayEn(w.word);c.appendChild(sp);
    const others=shuffle([...new Set(s.pool.filter(x=>x.mean!==w.mean&&!confusable(x.word,w.word)).map(x=>x.mean))]).slice(0,3);
    const opts=shuffle([w.mean,...others]);
    const fb=el("div","fb");
    const g=el("div","kopts");
    opts.forEach(m=>{const b=el("button","kopt",m);b.onclick=()=>{
      if(s.lock)return;
      if(m===w.mean){s.lock=true;b.classList.add("right");fb.className="fb good";{const t=pick(PRAISE);fb.textContent=t;mood("happy","잘했어!")}setTimeout(()=>{if(!wordAlive(s))return;s.lock=false;s.phase="spell";wordRender()},700)}
      else{s.miss=true;shakeIt(b);fb.className="fb retry";fb.textContent=pick(RETRY),mood("oops","괜찮아, 다시!")}};g.appendChild(b)});
    c.append(g,fb);sayEn(w.word);
  }else{
    c.appendChild(el("div","ksub","그림을 보고 영어 단어를 완성해 봐!"));
    if(!s.blanks){s.blanks=makeBlanks(w.word);s.filled={}}
    const solved=s.blanks.every(i=>i in s.filled);
    c.appendChild(wordPicture(w,true,solved));
    const slots=el("div","slots");
    const nextBlank=s.blanks.find(i=>!(i in s.filled));
    [...w.word].forEach((ch,i)=>{const sp=el("span");if(s.blanks.includes(i)){sp.className="blank"+(i===nextBlank?" cur":"");sp.textContent=s.filled[i]||""}else sp.textContent=ch;slots.appendChild(sp)});
    c.appendChild(slots);
    const fb=el("div","fb");
    if(!s.pad||s.pad.w!==w.word)s.pad={w:w.word,...makePad(w.word,s.blanks)};
    const pad=el("div","pad");
    s.pad.keys.forEach(ch=>{const b=el("button",null,ch);if(solved)b.disabled=true;b.onclick=()=>{
      const nb=s.blanks.find(i=>!(i in s.filled));if(nb==null||s.lock)return;
      if(w.word[nb].toLowerCase()===ch){s.filled[nb]=w.word[nb];
        if(s.blanks.every(i=>i in s.filled)){if(!s.miss){s.first++;s.stars+=3;s.combo=(s.combo||0)+1;combo(s)}else{s.stars+=1;s.combo=0}sayEn(w.word);s.lock=true;wordRender();
          setTimeout(()=>{if(!wordAlive(s))return;s.lock=false;s.i++;s.phase="mean";s.blanks=null;s.pad=null;s.miss=false;s.i<s.list.length?wordRender():wordEnd()},1500)}
        else wordRender()}
      else{s.miss=true;shakeIt(b);fb.className="fb retry";fb.textContent=pick(RETRY),mood("oops","괜찮아, 다시!")}};pad.appendChild(b)});
    c.append(pad,fb);
  }
  GB.appendChild(c);setStars(s.stars);
}
function wordEnd(){
  const s=WS;if(!s)return;if(s.saved){return}s.saved=true;try{logGame("wordLogs","wg",{set:s.set.title,n:s.list.length,first:s.first,at:Date.now()},s.stars)}catch(e){}
  GB.textContent="";const c=el("div","kcard");
  mood("cheer","단어왕 열무!");c.append(el("div","kend","다 풀었어요!"),el("div","ksub","한 번에 맞힌 단어 "+s.first+" / "+s.list.length+" · 별 "+s.stars+"개"));
  const a=el("button","kbtn","한 번 더");a.style.background="var(--k-pink)";a.onclick=()=>wordStart(s.set);
  const b=el("button","kbtn ghost","처음으로");b.onclick=closeRoom;
  c.append(a,b);GB.appendChild(c);setStars();
}

const bat=n=>[0,1,3,6,7,8].includes(n%10); // 숫자를 한글로 읽을 때 받침 여부
const eun=n=>n+(bat(n)?"은":"는"), wa=n=>n+(bat(n)?"과":"와");
function genProblem(lv){
  if(lv===6){lv=pick([3,4,5,5]);const p=genProblem(lv);return{a:p.a,b:p.b,ans:p.ans,steps:[{q:p.a+" + "+p.b+" = □",ans:p.ans}],hint:p.hint,direct:true}}
  if(lv===1){const a=rnd(1,9);return{a,b:10-a,ans:10,steps:[{q:a+" + □ = 10",ans:10-a,merge:true}],hideB:true,hint:"빈 칸이 몇 개 남았는지 세어 봐요"}}
  if(lv===2){const b=rnd(1,9);return Math.random()<.5
    ?{a:10,b,ans:10+b,steps:[{q:"10 + "+b+" = □",ans:10+b,merge:true}],hint:"10 묶음 하나와 낱개 "+b+"개 → 1"+b}
    :{a:10,b,ans:b,steps:[{q:(10+b)+" = 10 + □",ans:b,merge:true}],hint:eun(10+b)+" 10 묶음 하나랑 낱개 "+b+"개"}}
  if(lv===3){const o=rnd(1,7),a=10+o,b=rnd(1,9-o);return{a,b,ans:a+b,steps:[{q:a+" + "+b+" = □",ans:a+b,merge:true}],hint:"낱개끼리: "+o+" + "+b+" = "+(o+b)+" → 10 + "+(o+b)}}
  if(lv===4){const a=rnd(6,9),t=10-a,b=rnd(t+1,9),r=b-t;
    return{a,b,ans:a+b,steps:[{q:a+" + □ = 10",ans:t,merge:true},{q:eun(b)+" "+wa(t)+" □",ans:r},{q:"10 + "+r+" = □",ans:10+r}],hint:a+"에 "+t+" 주면 10! 남은 "+r+" 더해요"}}
  const o=rnd(2,9),a=10+o,t=10-o,b=rnd(t+1,9),r=b-t;
  return{a,b,ans:a+b,steps:[{q:a+" + □ = 20",ans:t,merge:true},{q:eun(b)+" "+wa(t)+" □",ans:r},{q:"20 + "+r+" = □",ans:20+r}],hint:a+"에 "+t+" 주면 20! 남은 "+r+" 더해요"};
}
function frames(a,b,merged){
  const wrap=el("div","frames");
  const draw=(dots,label)=>{const nf=Math.max(1,Math.ceil(dots.length/10));
    for(let f=0;f<nf;f++){
      const box=el("div");const tf=el("div","tf");const chunk=dots.slice(f*10,f*10+10);if(chunk.length===10)tf.classList.add("full");
      for(let i=0;i<10;i++){const d=el("i");if(chunk[i])d.className=chunk[i];tf.appendChild(d)}
      box.appendChild(tf);if(label&&f===nf-1)box.appendChild(el("div","tfl",label));wrap.appendChild(box)}};
  const A=Array(a).fill("a"),B=Array(b).fill("b");
  if(merged)draw(A.concat(B),"");else{draw(A,String(a));if(b)draw(B,String(b))}
  return wrap;
}
let MS=null;
function mathStart(){HOST="sd";{const mm=document.getElementById("mascot");if(mm)mm.innerHTML=""}openRoom("수학 게임");MS={lv:mathLevel,i:0,n:10,first:0,stars:0,wrongs:[]};mathNext()}
function mathNext(){MS.p=genProblem(MS.lv);MS.step=0;MS.miss=false;MS.input="";MS.showHint=false;mathRender()}
function mathRender(){
  GB.textContent="";const s=MS,p=s.p,st=p.steps[s.step];
  const c=el("div","kcard");
  const pr=el("div","kprog");for(let i=0;i<s.n;i++){const d=el("i");if(i<s.i)d.className="done";else if(i===s.i)d.className="now";pr.appendChild(d)}
  c.append(pr,el("div","ksub",s.lv+"단계 · "+LV[s.lv].name+" — "+LV[s.lv].desc));
  if(!p.direct||s.showHint){
    const shown=p.steps.slice(0,s.step).some(x=>x.merge)||(p.steps.length===1&&s.solved);
    c.appendChild(frames(p.a,(p.hideB&&!shown)?0:p.b,shown));
  }
  if(p.steps.length>1){const sl=el("div","ksteps");p.steps.forEach((x,i)=>{if(i<s.step)sl.appendChild(el("div","done","✓ "+x.q.replace("□",x.ans)))});if(sl.children.length)c.appendChild(sl)}
  const q=el("div","kq");const parts=st.q.split("□");q.append(parts[0]);const bx=el("span","box",s.input||"?");q.append(bx,parts[1]||"");c.appendChild(q);
  if(s.showHint)c.appendChild(el("div","hint",p.hint));
  const fb=el("div","fb");c.appendChild(fb);
  const np=el("div","npad");
  [1,2,3,4,5,6,7,8,9,"지움",0,"확인"].forEach(v=>{const b=el("button",v==="확인"?"ok":null,String(v));if(typeof v==="string")b.style.fontSize="20px";
    b.onclick=()=>{
      if(v==="지움"){s.input=s.input.slice(0,-1);bx.textContent=s.input||"?";return}
      if(v==="확인"){if(!s.input)return;
        if(Number(s.input)===st.ans){fb.className="fb good";{const t=pick(PRAISE);fb.textContent=t;mood("happy","잘했어!")}s.input="";
          if(s.step<p.steps.length-1){s.step++;setTimeout(mathRender,600)}
          else{s.solved=true;if(!s.miss){s.first++;s.stars+=2;s.combo=(s.combo||0)+1;combo(s)}else{s.stars+=1;s.combo=0;s.wrongs.push(p.a+"+"+p.b)}
            setTimeout(()=>{s.solved=false;s.i++;s.i<s.n?mathNext():mathEnd()},900)}}
        else{s.miss=true;s.showHint=true;s.input="";mathRender();const f=GB.querySelector(".fb");f.className="fb retry";f.textContent=pick(RETRY);mood("oops","괜찮아, 다시!");shakeIt(GB.querySelector(".kq"))}
        return}
      if(s.input.length<2){s.input+=String(v);bx.textContent=s.input}};
    np.appendChild(b)});
  c.appendChild(np);
  if(!s.showHint){const h=el("button","kbtn ghost","힌트 보기");h.onclick=()=>{s.showHint=true;mathRender()};c.appendChild(h)}
  GB.appendChild(c);setStars(s.stars);
}
function mathEnd(){
  const s=MS,up=s.first>=8&&s.lv<6;
  logGame("mathLogs","mg",{lv:s.lv,n:s.n,first:s.first,wrongs:s.wrongs,at:Date.now()},s.stars);
  if(up){mathLevel=s.lv+1;store.level=mathLevel;persist()}
  GB.textContent="";const c=el("div","kcard");
  mood("cheer",up?"한 단계 올라갔다!":"최고야 열무!");c.append(el("div","kend",up?"다음 단계로 올라가요!":"잘했어요!"),
    el("div","ksub","한 번에 맞힌 문제 "+s.first+" / "+s.n+" · 별 "+s.stars+"개"),
    el("div","hint",up?(s.lv+1)+"단계 「"+LV[s.lv+1].name+"」가 열렸어요":"10문제 중 8개를 한 번에 맞히면 다음 단계가 열려요"));
  const a=el("button","kbtn","한 번 더");a.style.background="var(--k-blue)";a.onclick=mathStart;
  const b=el("button","kbtn ghost","처음으로");b.onclick=closeRoom;
  c.append(a,b);GB.appendChild(c);setStars();
}

/* ===== 효과: 별 터지기 · 색종이 · 효과음 ===== */
let AC=null;
function tone(seq){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;
  seq.forEach(([f,st,du,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
   g.gain.setValueAtTime(0,t0+st);g.gain.linearRampToValueAtTime(.18,t0+st+.02);g.gain.exponentialRampToValueAtTime(.001,t0+st+du);
   o.connect(g);g.connect(AC.destination);o.start(t0+st);o.stop(t0+st+du+.05)})}catch(e){}}
const SFX={good:()=>tone([[784,0,.15,"triangle"],[1175,.09,.25,"triangle"]]),
  oops:()=>tone([[330,0,.18,"sine"],[262,.12,.22,"sine"]]),
  win:()=>tone([[523,0,.15,"triangle"],[659,.12,.15,"triangle"],[784,.24,.15,"triangle"],[1047,.36,.4,"triangle"]])};
function burst(x,y,n,chars){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  for(let k=0;k<n;k++){const e=document.createElement("span");e.className="fx";e.textContent=pick(chars);
    e.style.left=x+"px";e.style.top=y+"px";e.style.color=pick(["#ff6fa3","#3d9bff","#ffc93c","#2fc283","#a98bff"]);
    e.style.fontSize=(16+Math.random()*16)+"px";document.body.appendChild(e);
    const a=Math.random()*Math.PI*2,r=60+Math.random()*90;
    e.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:1},{transform:"translate(calc(-50% + "+Math.cos(a)*r+"px),calc(-50% + "+(Math.sin(a)*r-30)+"px)) scale(1.1) rotate("+(Math.random()*360)+"deg)",opacity:0}],{duration:800+Math.random()*400,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>e.remove()}}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  for(let k=0;k<40;k++){const e=document.createElement("span");e.className="fx";e.textContent=pick(["■","●","▲","★","♥"]);
    e.style.left=(Math.random()*100)+"vw";e.style.top="-20px";e.style.color=pick(["#ff6fa3","#3d9bff","#ffc93c","#2fc283","#a98bff","#ff9a3c"]);
    e.style.fontSize=(10+Math.random()*14)+"px";document.body.appendChild(e);
    e.animate([{transform:"translateY(0) rotate(0)"},{transform:"translateY(110vh) rotate("+(360+Math.random()*720)+"deg)"}],{duration:1800+Math.random()*1400,delay:Math.random()*500,easing:"linear"}).onfinish=()=>e.remove()}}
let lastTap={x:innerWidth/2,y:innerHeight/2};

const _mood=mood;

function tosuni(mood){

  const t=pick(TS_SAYS);if(sayEl){sayEl.textContent=t;sayEl.hidden=false}
  ymSpeak(t,"ko-KR",1.15,1.9)
  clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.classList.remove("spin","kick","hop");btn.innerHTML=tosuni("hi")},1500);
}

/* ===================== 시계 읽기 게임 ===================== */
const CLV=[null,
 {name:"정각",desc:"짧은 바늘만 보고 몇 시?"},
 {name:"30분",desc:"정각이랑 ○시 30분"},
 {name:"5분씩",desc:"긴 바늘 숫자 한 칸 = 5분"},
 {name:"1분씩",desc:"작은 눈금까지 세기"},
 {name:"초 읽기",desc:"주황 바늘로 초까지 (5초씩)"},
 {name:"초까지 다",desc:"시·분·초 모두 읽기"}];
let clockLevel=Math.min(6,Math.max(1,Number(store.clockLevel)||1));
const HAND={h:{c:"#ff5f98",n:"분홍 짧은 바늘",u:"시"},m:{c:"#2f8af5",n:"파란 긴 바늘",u:"분"},s:{c:"#ff9a3c",n:"주황 얇은 바늘",u:"초"}};
function genClock(lv){
  const h=rnd(1,12);let m=0,s=0,keys=["h"];
  if(lv===2){m=Math.random()<.7?30:0;keys=["h","m"]}
  else if(lv===3){m=5*rnd(1,11);keys=["h","m"]}
  else if(lv===4){do{m=rnd(1,59)}while(m%5===0&&Math.random()<.8);keys=["h","m"]}
  else if(lv===5){m=5*rnd(0,11);s=5*rnd(1,11);keys=["h","m","s"]}
  else if(lv===6){m=rnd(0,59);s=rnd(1,59);keys=["h","m","s"]}
  return{h,m,s,keys,sec:lv>=5};
}
function timeText(p){return p.h+"시"+(p.m||p.sec?" "+p.m+"분":"")+(p.sec?" "+p.s+"초":"")}
function clockHint(p,k){
  if(k==="h"){
    if(p.m===0)return"긴 바늘이 12에 있으면 정각! 짧은 바늘 숫자가 바로 '시'예요";
    const nx=p.h%12+1;
    return"짧은 바늘이 "+wa(p.h)+" "+nx+" 사이에 있어요. 아직 "+nx+"에 못 갔으니 막 지나간 숫자 "+p.h+(bat(p.h)?"이":"가")+" '시'예요";
  }
  const v=k==="m"?p.m:p.s,u=HAND[k].u,big=Math.floor(v/5),small=v%5;
  if(v===0)return"바늘이 12에 있으면 0"+u+"이에요";
  if(small===0)return"숫자 "+big+"에 있어요 → 한 칸에 5"+u+"씩: 5 × "+big+" = "+v+u;
  return(big?"숫자 "+big+"까지 "+(5*big)+u+", ":"12에서 ")+"작은 눈금 "+small+"칸 더 → "+(5*big)+" + "+small+" = "+v+u;
}
function clockSvg(p,focus,ring){
  const ang=k=>{const a=k==="h"?((p.h%12)+p.m/60+(p.sec?p.s/3600:0))*30:k==="m"?(p.m+(p.sec?p.s/60:0))*6:p.s*6;return(a-90)*Math.PI/180};
  let g='<svg class="clk" viewBox="-124 -124 248 248" role="img" aria-label="시계">'+
   '<defs><radialGradient id="clkFace" cx="45%" cy="38%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f3fbf7"/></radialGradient></defs>'+
   '<circle r="100" fill="url(#clkFace)" stroke="#3fbf9b" stroke-width="8"/><circle r="100" fill="none" stroke="#2a9a7b" stroke-width="1" opacity=".4"/>';
  const val=focus==="m"?p.m:focus==="s"?p.s:null;
  for(let i=0;i<60;i++){const a=(i*6-90)*Math.PI/180,big=i%5===0;
    let col=big?"#5c6b64":"#b7c4bd";
    if(ring&&val!=null&&val%5&&i>Math.floor(val/5)*5&&i<=val)col=HAND[focus].c;
    g+='<line x1="'+(Math.cos(a)*(big?82:87)).toFixed(1)+'" y1="'+(Math.sin(a)*(big?82:87)).toFixed(1)+'" x2="'+(Math.cos(a)*93).toFixed(1)+'" y2="'+(Math.sin(a)*93).toFixed(1)+'" stroke="'+col+'" stroke-width="'+(big?3:(col.charAt(1)==="b"?1.5:3))+'" stroke-linecap="round"/>'}
  for(let n=1;n<=12;n++){const a=(n*30-90)*Math.PI/180;
    g+='<text x="'+(Math.cos(a)*66).toFixed(1)+'" y="'+(Math.sin(a)*66+8).toFixed(1)+'" text-anchor="middle" font-family="Jua,sans-serif" font-size="23" fill="#2d3d36">'+n+'</text>';
    if(ring)g+='<text x="'+(Math.cos(a)*113).toFixed(1)+'" y="'+(Math.sin(a)*113+4.5).toFixed(1)+'" text-anchor="middle" font-family="Jua,sans-serif" font-size="13" fill="'+HAND[focus].c+'">'+(n===12?0:n*5)+'</text>'}
  const op=k=>focus&&focus!==k?.22:1;
  const hand=(k,len,w,tail)=>{const a=ang(k);return'<line x1="'+(-tail*Math.cos(a)).toFixed(1)+'" y1="'+(-tail*Math.sin(a)).toFixed(1)+'" x2="'+(len*Math.cos(a)).toFixed(1)+'" y2="'+(len*Math.sin(a)).toFixed(1)+'" stroke="'+HAND[k].c+'" stroke-width="'+w+'" stroke-linecap="round" opacity="'+op(k)+'"/>'};
  g+=hand("h",50,10,10)+hand("m",76,6.5,12);
  if(p.sec)g+=hand("s",86,2.8,18);
  g+='<circle r="7" fill="#2d3d36"/><circle r="3" fill="#fff"/></svg>';
  return g;
}
let CS=null;
function clockStart(){HOST="ts";openRoom("시계 게임");const mm=document.getElementById("mascot");if(mm)mm.innerHTML=tosuni("hi");
  CS={lv:clockLevel,i:0,n:8,first:0,stars:0,wrongs:[]};clockNext();
  try{const u=new SpeechSynthesisUtterance("시계 같이 읽어 보자");u.lang="ko-KR";u.pitch=1.9;u.rate=1.1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function clockNext(){CS.lock=false;CS.p=genClock(CS.lv);CS.step=0;CS.miss=false;CS.input="";CS.showHint=false;CS.done=false;clockRender()}
function clockRender(){
  GB.textContent="";const s=CS,p=s.p,k=p.keys[s.step];
  const c=el("div","kcard");
  const pr=el("div","kprog");for(let i=0;i<s.n;i++){const d=el("i");if(i<s.i)d.className="done";else if(i===s.i)d.className="now";pr.appendChild(d)}
  c.append(pr,el("div","ksub",s.lv+"단계 · "+CLV[s.lv].name+" — "+CLV[s.lv].desc));
  const cw=el("div","clkwrap");cw.innerHTML=clockSvg(p,s.done?null:k,s.showHint&&!s.done&&k!=="h");c.appendChild(cw);
  if(s.done){
    c.append(el("div","kq",timeText(p)),el("div","clkdig",String(p.h)+":"+String(p.m).padStart(2,"0")+(p.sec?":"+String(p.s).padStart(2,"0"):"")));
    GB.appendChild(c);setStars(s.stars);return;
  }
  const got=el("div","clkgot");p.keys.forEach((x,i)=>{const t=el("span",i<s.step?"ok":i===s.step?"now":null,i<s.step?(x==="h"?p.h:x==="m"?p.m:p.s)+HAND[x].u:"?"+HAND[x].u);t.style.setProperty("--hc",HAND[x].c);got.appendChild(t)});
  if(p.keys.length>1)c.appendChild(got);
  const tag=el("div","handtag");tag.style.setProperty("--hc",HAND[k].c);tag.append(el("i"),document.createTextNode(HAND[k].n+"는 몇 "+HAND[k].u+"?"));c.appendChild(tag);
  const q=el("div","kq");const bx=el("span","box",s.input||"?");q.append(bx,HAND[k].u);c.appendChild(q);
  if(s.showHint)c.appendChild(el("div","hint",clockHint(p,k)));
  const fb=el("div","fb");c.appendChild(fb);
  const ans=k==="h"?p.h:k==="m"?p.m:p.s;
  const np=el("div","npad");
  [1,2,3,4,5,6,7,8,9,"지움",0,"확인"].forEach(v=>{const b=el("button",v==="확인"?"ok":null,String(v));if(typeof v==="string")b.style.fontSize="20px";
    b.onclick=()=>{if(s.lock)return;
      if(v==="지움"){s.input=s.input.slice(0,-1);bx.textContent=s.input||"?";return}
      if(v==="확인"){if(!s.input)return;
        if(Number(s.input)===ans){s.lock=true;fb.className="fb good";fb.textContent=pick(PRAISE);mood("happy","딩동!");s.input="";
          if(s.step<p.keys.length-1){s.step++;s.showHint=false;setTimeout(()=>{s.lock=false;clockRender()},600)}
          else{if(!s.miss){s.first++;s.stars+=2;s.combo=(s.combo||0)+1;combo(s)}else{s.stars+=1;s.combo=0;s.wrongs.push(timeText(p))}
            setTimeout(()=>{s.done=true;clockRender();sayKo(timeText(p));setTimeout(()=>{s.i++;s.i<s.n?clockNext():clockEnd()},1700)},500)}}
        else{s.miss=true;s.showHint=true;s.input="";clockRender();const f=GB.querySelector(".fb");f.className="fb retry";f.textContent=pick(RETRY);mood("oops","힌트 봐!");shakeIt(GB.querySelector(".kq"))}
        return}
      if(s.input.length<2){s.input+=String(v);bx.textContent=s.input}};
    np.appendChild(b)});
  c.appendChild(np);
  if(!s.showHint){const h=el("button","kbtn ghost","힌트 보기");h.onclick=()=>{s.showHint=true;clockRender()};c.appendChild(h)}
  GB.appendChild(c);setStars(s.stars);
}
function sayKo(t){ymSpeak(t,"ko-KR",.95,1.5)}
function clockEnd(){
  const s=CS,up=s.first>=6&&s.lv<6;
  logGame("clockLogs","cg",{lv:s.lv,n:s.n,first:s.first,wrongs:s.wrongs,at:Date.now()},s.stars);
  if(up){clockLevel=s.lv+1;store.clockLevel=clockLevel;persist()}
  GB.textContent="";const c=el("div","kcard");
  mood("cheer",up?"한 단계 올라갔다!":"시계 박사 열무!");
  c.append(el("div","kend",up?"다음 단계로 올라가요!":"잘했어요!"),
    el("div","ksub","한 번에 맞힌 시계 "+s.first+" / "+s.n+" · 별 "+s.stars+"개"),
    el("div","hint",up?(s.lv+1)+"단계 「"+CLV[s.lv+1].name+"」가 열렸어요":"8개 중 6개를 한 번에 맞히면 다음 단계가 열려요"));
  const a=el("button","kbtn","한 번 더");a.onclick=clockStart;
  const b=el("button","kbtn ghost","처음으로");b.onclick=closeRoom;
  c.append(a,b);GB.appendChild(c);setStars();
}
/* 가족 설정에 시계 단계 추가 */
const _familySheet=familySheet;
familySheet=function(){
  _familySheet();
  const inn=document.querySelector(".sheet:last-of-type .in");if(!inn)return;
  const anchor=inn.querySelector(".kbtn");
  const t=el("div","ksub","시계 시작 단계 (8개 중 6개를 한 번에 맞히면 자동으로 올라가요)");
  const row=el("div","lvrow");
  for(let i=1;i<=6;i++){const bt=el("button",i===clockLevel?"on":null,String(i));bt.onclick=()=>{clockLevel=i;store.clockLevel=i;persist();document.querySelector(".sheet:last-of-type").remove();home()};row.appendChild(bt)}
  const names=el("div","ksub",CLV.slice(1).map((x,i)=>(i+1)+". "+x.name).join(" · "));
  inn.insertBefore(t,anchor);inn.insertBefore(row,anchor);inn.insertBefore(names,anchor);
};

/* ===================== 들어올 때 노래 (직접 만든 신나는 멜로디) ===================== */
let MUSIC_ON=store.music!==false,BGM=null,BGM_PLAYED=false;
const NOTE=n=>{const m={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[n[0]],s=n[1]==="#"?1:0,o=Number(n[n.length-1]);return 440*Math.pow(2,(m+s+12*(o+1)-69)/12)};
const TUNE=[ // [음, 박]  — 열무 게임방 주제가
 ["C5",.5],["E5",.5],["G5",.5],["E5",.5],["A5",.75],["G5",.25],["E5",1],
 ["F5",.5],["A5",.5],["G5",.5],["E5",.5],["D5",1.5],[null,.5],
 ["C5",.5],["E5",.5],["G5",.5],["C6",.5],["B5",.5],["A5",.5],["G5",1],
 ["A5",.5],["G5",.5],["E5",.5],["D5",.5],["C5",.5],["G5",.25],["C6",.25],["C6",1],
 ["E5",.25],["F5",.25],["G5",.5],["G5",.5],["A5",.25],["G5",.25],["E5",.5],["C5",.5],
 ["D5",.5],["E5",.5],["F5",.5],["D5",.5],["G5",1.5],[null,.5],
 ["E5",.25],["F5",.25],["G5",.5],["G5",.5],["A5",.25],["B5",.25],["C6",.5],["A5",.5],
 ["G5",.5],["E5",.5],["D5",.5],["G4",.5],["C5",1.5]];
const BASS=["C3","C3","F3","G3","C3","A2","F3","G3","C3","G3","D3","G3","C3","A2","G2","C3"];
function playSong(){
  if(!MUSIC_ON)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    stopSong();const bpm=150,b=60/bpm,t0=AC.currentTime+.08,master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);BGM=master;
    const blip=(f,st,du,type,vol)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol,st+.015);g.gain.exponentialRampToValueAtTime(.001,st+du);
      o.connect(g);g.connect(master);o.start(st);o.stop(st+du+.05)};
    let t=t0;TUNE.forEach(([n,beats])=>{if(n){blip(NOTE(n),t,beats*b*.95,"triangle",.2);blip(NOTE(n)*2,t,beats*b*.4,"sine",.04)}t+=beats*b});
    const total=t-t0;
    for(let i=0;i*2*b<total;i++){const bn=BASS[i%BASS.length],st=t0+i*2*b;blip(NOTE(bn),st,b*.8,"square",.05);blip(NOTE(bn)*1.5,st+b,b*.6,"square",.035)}
    for(let i=0;i*b<total;i++){const st=t0+i*b; // 통통 북 + 찰찰
      const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(i%2?220:140,st);o.frequency.exponentialRampToValueAtTime(50,st+.12);
      g.gain.setValueAtTime(.18,st);g.gain.exponentialRampToValueAtTime(.001,st+.15);o.connect(g);g.connect(master);o.start(st);o.stop(st+.2);
      const len=AC.sampleRate*.05,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let k=0;k<len;k++)d[k]=(Math.random()*2-1)*(1-k/len);
      const ns=AC.createBufferSource(),hp=AC.createBiquadFilter(),ng=AC.createGain();hp.type="highpass";hp.frequency.value=6000;ng.gain.value=.05;ns.buffer=buf;ns.connect(hp);hp.connect(ng);ng.connect(master);ns.start(st+b/2)}
    BGM_PLAYED=true;
    const sd=document.querySelector(".fieldSd"),ts=document.querySelector(".fieldTs");
    [sd,ts].forEach(x=>{if(x){x.classList.add("dance");setTimeout(()=>x.classList.remove("dance"),total*1000)}});
    const say=document.querySelector(".say");if(say)say.textContent="♪ 열무 게임방에 온 걸 환영해! ♪";
  }catch(e){}
}
function stopSong(){if(BGM){try{BGM.gain.setValueAtTime(BGM.gain.value,AC.currentTime);BGM.gain.linearRampToValueAtTime(0,AC.currentTime+.2);const g=BGM;setTimeout(()=>{try{g.disconnect()}catch(e){}},300)}catch(e){}BGM=null}}
{const st=document.createElement("style");st.textContent="@media (prefers-reduced-motion:no-preference){.dance{animation:sdDance .5s ease-in-out infinite alternate}@keyframes sdDance{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-10px) rotate(6deg)}}}.avatar,.starpill{white-space:nowrap}.hright{gap:5px}.hico{width:42px;height:42px;flex:none}@media (max-width:400px){.avatar span{font-size:15px}.avatar{padding-right:10px}.starpill{padding:6px 10px;font-size:17px}}";document.head.appendChild(st)}
const _homeM=home;
home=function(){
  _homeM();
  const hr=document.querySelector(".hright");if(!hr)return;
  const b=el("button","hico");b.style.setProperty("--oc",MUSIC_ON?"linear-gradient(#ffb3d1,#ff6fa3)":"linear-gradient(#cfd6d2,#9aa8a1)");
  b.append(el("span","g","♪"),el("span",null,"노래"));b.setAttribute("aria-label","노래 켜기/끄기");
  b.onclick=e=>{e.stopPropagation();if(BGM){stopSong();if(MUSIC_ON){MUSIC_ON=false;store.music=false;persist();home()}return}
    MUSIC_ON=true;store.music=true;persist();home();playSong()};
  hr.insertBefore(b,hr.firstChild);
};
/* 처음 들어올 때: 바로 틀어 보고, 브라우저가 막으면 첫 터치 때 */
function firstSong(){if(BGM_PLAYED)return;playSong()}
try{AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="running")setTimeout(firstSong,400)}catch(e){}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,function f(){document.removeEventListener(ev,f,true);try{if(AC&&AC.state==="suspended")AC.resume()}catch(e){}if(!BGM_PLAYED)setTimeout(firstSong,50)},true));

home();
})();
